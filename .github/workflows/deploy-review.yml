name: Deploy Review

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/final-ecosystem-world-v4]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Netlify review site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 19b6f1fb-b369-4a67-9fec-5934dc4b2315
        run: npx --yes netlify-cli@latest deploy --dir=dist --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "3D portfolio art-direction redesign ${GITHUB_SHA}"
